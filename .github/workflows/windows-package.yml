name: Build Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" -r requirements-build.txt
      - run: python -m pytest -q
      - run: python tools/package_windows.py
      - run: python tools/smoke_windows.py installers/PlotProof-0.2.0-windows-x64/PlotProof.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PlotProof-native-windows-x64
          path: |
            installers/PlotProof-*-windows-x64.zip
            installers/PlotProof-*-windows-x64.zip.sha256
          if-no-files-found: error
