[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotproof"
version = "0.2.0"
description = "Find suspected story contradictions with verifiable manuscript evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "CARL JOSEPH LEE"}]
dependencies = ["PySide6-Essentials==6.10.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.4"]

[project.scripts]
plotproof = "plotproof.__main__:main"

[tool.setuptools.packages.find]
include = ["plotproof*"]

[tool.setuptools.package-data]
plotproof = ["examples/*.txt", "desktop/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/package_windows.py" = ["E402"]
"tests/test_desktop.py" = ["E402"]
